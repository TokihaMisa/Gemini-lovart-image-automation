excel:
  path: "data\\products.xlsx"
  sheet: 0
  columns:
    id: "A"
    name_cn: "B"
    image_size: "C"
    language: "D"
    selling_points: "E"
    # Fill 是/否. 是 = later reference images are the same product/spec/color/style.
    reference_images_are_product: "I"
  image_columns:
    start: "F"
    # Optional: stop at a fixed column.
    # end: "J"
    # Optional: scan at most N columns from start if end is not set.
    max_columns: 20
    # Optional: stop after N consecutive empty image cells if neither end nor max_columns stops first.
    empty_streak: 20

browser:
  # Optional. Leave empty to auto-detect Chrome/Edge or use Playwright's bundled Chromium.
  chrome_exe: ""
  user_data_dir: "browser_profile"
  network_attempts: 5
  page_ready_timeout: 90
  product_attempts: 2
  retry_delays: [3, 6, 12, 20]

gemini:
  preamble_file: "preamble.txt"
  base_url: "https://gemini.google.com"
  thinking_mode: true
  # When false, stop instead of creating persistent history if temporary chat cannot be found.
  allow_regular_chat_fallback: false
  reply_timeout: 300
  upload_timeout: 120
  upload_attempts: 3

gemini_api:
  # Set GEMINI_API_KEY in your environment.
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  model: gemini-2.5-flash-lite

nvidia_api:
  # Set NVIDIA_API_KEY in your environment or .env.
  base_url: "https://integrate.api.nvidia.com/v1"
  model: moonshotai/kimi-k2.5
  # The fields below are retained only to support legacy configurations.
  # New configurations should select the direct model field above.
  model_choice: "kimi"
  send_images: true
  models:
    # Kimi K2.5 supports image input and thinking mode by default.
    kimi: "moonshotai/kimi-k2.5"

openai_image:
  # Keep OPENAI_IMAGE_API_KEY only in local .env. Copy the provider's Base URL as supplied.
  # Both root endpoints and endpoints ending in /v1 are supported.
  # Leave this empty to avoid silently selecting a provider.
  base_url: ""
  model: "gpt-image-2"
  # The gateway-supported options are 1K, 2K, and 4K.
  resolution: "1K"
  # Enable to combine references into one Data URL before submitting the task.
  merge_reference_images: false

image_generation:
  # Support and final-detail providers are independent; failures never auto-fallback.
  support_provider: lovart
  detail_provider: lovart

prompt_settings:
  # This is snapshotted per product when detail generation begins; resume keeps the snapshot.
  detail_page_count: 12
  design_style: "温馨感、高级感"
  required_sections: ["主标题", "副标题", "信息布局", "排版形式"]
  image_quality: "1K"
  logo_policy: "不出现 Logo"
  copy_style: "适合跨境电商，具体、不空泛"
  copy_detail_level: "详细"
  product_fidelity: "严格还原"
  white_background_requirements: "白底、超清摄影、突出高级感，产品造型与原图一致"
  scene_requirements: "重新设计场景，产品特征与原图保持一致，超清摄影"
  allow_questions: false
  default_language: "巴西葡萄牙语"
  missing_image_size_policy: "不使用默认固定图片比例"
  extra_requirements: ""

lovart:
  # Set LOVART_ACCESS_KEY and LOVART_SECRET_KEY in your environment.
  base_url: "https://lgw.lovart.ai"
  # image_model options:
  # auto, gpt_image_2, nano_banana, nano_banana_2, nano_banana_pro,
  # midjourney, seedream_v4, seedream_v4_5
  # Multiple models are allowed with commas, e.g. "nano_banana_2,nano_banana_pro".
  image_model: "auto"
  # Filled by the WebUI account detector. In unlimited mode these models are
  # revalidated against the live account entitlement and tried in this order.
  unlimited_models: []
  unlimited_model_catalog: []
  # prefer = let Lovart Agent auto-plan but prefer this image model.
  # force = force only this image generation tool.
  model_selection: "prefer"
  # Optional: fast or thinking. Empty/default lets Lovart choose its default.
  reasoning_mode: "fast"
  # In unlimited mode, if Lovart shows a credits confirmation, do not confirm it.
  # The automation records needs_manual_action and continues with the next product.
  max_confirmation_rounds: 5
  max_auto_confirm_credits: 10
  wait_timeout: 10800
  poll_interval: 10
  # Check the result endpoint less often while running; status remains every 10s.
  poll_confirmation_interval: 30
  # Consecutive polling failures back off gradually up to this many seconds.
  poll_error_backoff_max: 60
  # Keep polling responsive when the network stalls. Each polling request returns
  # control to the progress loop after at most this many seconds.
  poll_request_timeout: 10
  poll_request_attempts: 1
  timeout: 600
  upload_attempts: 3
  upload_retry_delay: 2
  # Failed products are retried only after the current full queue finishes.
  # off = disabled, finite = retry failed_retry_rounds times, infinite = retry until success or exit.
  failed_retry_mode: finite
  failed_retry_rounds: 2
  failed_retry_delay: 15
  failed_retry_error_types:
    - lovart_service
    - network
    - timeout
    - gemini_page
    - gemini_upload
